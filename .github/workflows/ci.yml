name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

# CI never needs to write to the repository.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight CI run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # v3 installs `tools platform-tools` by default, but the `tools` package no
      # longer exists in the SDK repository ("Failed to find package 'tools'").
      # cmdline-tools is preinstalled on the runner, so only platform-tools is
      # requested here.
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # gradle/libs.versions.toml pins compileSdk = 37, so the runner needs
      # platforms;android-37. setup-android does not install it for us.
      - name: Install Android SDK platform 37 and build-tools
        run: |
          # -e so a failed package install fails this step instead of being
          # skipped silently (licenses are accepted by setup-android already).
          set -euo pipefail

          install_pkg() {
            if ! sdkmanager "$1" >/dev/null; then
              echo "::error title=SDK install failed::sdkmanager could not install $1"
              return 1
            fi
            echo "installed: $1"
          }

          install_pkg "platforms;android-37"
          install_pkg "platform-tools"

          # Prefer the build-tools line that matches API 37; fall back to the
          # newest published one so a missing 37.x preview does not fail CI.
          # Both paths hard-fail when nothing is found; a failing listing is a
          # real error, only an empty grep match is tolerated.
          AVAILABLE="$(sdkmanager --list 2>/dev/null)"
          BT37="$(printf '%s\n' "$AVAILABLE" | grep -oE 'build-tools;37\.[0-9.]+' | sort -uV | tail -n 1 || true)"
          if [ -n "$BT37" ]; then
            install_pkg "$BT37"
          else
            BTANY="$(printf '%s\n' "$AVAILABLE" | grep -oE 'build-tools;[0-9.]+' | sort -uV | tail -n 1 || true)"
            if [ -z "$BTANY" ]; then
              echo "::error title=SDK install failed::no build-tools package found in the SDK repository"
              exit 1
            fi
            echo "::warning title=build-tools 37.x unavailable::installing $BTANY instead"
            install_pkg "$BTANY"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The repository tracks gradlew without the executable bit, so make it
      # runnable in every job that calls it.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile and run unit tests
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/outputs/logs/**
            **/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
